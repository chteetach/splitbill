# docker compose up --build            -> PostgreSQL + API on http://localhost:8000
# docker compose run --rm backend-tests -> run the pytest suite against a throwaway database
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitbill-local-only}
      POSTGRES_DB: splitbill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-splitbill} -d splitbill"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-splitbill}:${POSTGRES_PASSWORD:-splitbill-local-only}@db:5432/splitbill
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  backend-tests:
    build: ./backend
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-splitbill}:${POSTGRES_PASSWORD:-splitbill-local-only}@db:5432/splitbill_test
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-splitbill}:${POSTGRES_PASSWORD:-splitbill-local-only}@db:5432/splitbill_test
    command: ["sh", "-c", "uv sync --frozen --group dev && pytest"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
